# core 任务：core/ 的自动化测试，只用 Node 自带的测试运行器，不安装任何依赖
# dom 任务：注入函数在真实 Chromium 里的行为（tests/dom/），临时装上 Playwright 再跑
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/**/*.test.mjs"

  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test "tests/dom/*.test.mjs"
