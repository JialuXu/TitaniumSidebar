<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Titanium</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- 顶部栏：产品名 + 新对话 + 设置 -->
  <header class="topbar">
    <div class="topbar-title">Titanium</div>
    <div class="topbar-actions">
      <button id="btn-new-chat" class="topbar-btn" type="button">新对话</button>
      <button id="btn-settings" class="topbar-btn topbar-btn-icon" type="button" title="设置">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 上下文状态条：读取状态 / 页面标题与字数 / 脱敏徽标 / 重新读取 -->
  <div class="context-bar">
    <span id="ctx-caret" class="ctx-caret" hidden>▸</span>
    <span id="ctx-text" class="ctx-text">发送消息时将读取当前页面</span>
    <span id="ctx-badge" class="ctx-badge" hidden></span>
    <button id="btn-refresh" class="ctx-btn" type="button" hidden>重新读取</button>
  </div>

  <!-- 已读取内容详情：点击状态条展开，再次点击折叠 -->
  <div id="ctx-detail" class="ctx-detail">
    <div class="ctx-detail-meta"><span id="ctx-detail-url"></span></div>
    <div id="ctx-detail-text" class="ctx-detail-text"></div>
  </div>

  <!-- 消息流 -->
  <main id="chat" class="chat">
    <div id="welcome" class="welcome">
      <div class="welcome-title">Titanium</div>
      <p>发送消息时，我会读取当前网页的文字内容作为上下文，帮你解读、总结、答疑。打开侧边栏本身不读取页面。</p>
      <div class="credit">Design by Xujl</div>
    </div>
  </main>

  <!-- 未配置模型接口时的引导条 -->
  <div id="config-hint" class="config-hint" hidden>
    尚未配置模型接口
    <button id="btn-goto-settings" class="link-btn" type="button">去设置</button>
  </div>

  <!-- 输入区 -->
  <footer class="composer">
    <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="btn-send" class="send-btn" type="button">发送</button>
  </footer>

  <!-- 设置抽屉 -->
  <div id="settings-mask" class="settings-mask"></div>
  <aside id="settings" class="settings" aria-label="设置">
    <div class="settings-head">
      <span>设置</span>
      <button id="btn-close-settings" class="topbar-btn" type="button" title="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label class="cfg-field">接口地址（baseUrl）
        <input id="cfg-baseurl" type="text" placeholder="https://api.deepseek.com/v1" spellcheck="false">
      </label>
      <label class="cfg-field">模型名称
        <input id="cfg-model" type="text" placeholder="deepseek-chat" spellcheck="false">
      </label>
      <label class="cfg-field">API Key
        <input id="cfg-apikey" type="password" placeholder="可留空（视网关而定）">
      </label>
      <label class="cfg-switch">
        <input id="cfg-mask" type="checkbox" checked>
        发送前脱敏（身份证 / 银行卡 / 手机号）
      </label>
      <div class="settings-actions">
        <button id="btn-test" class="ghost-btn" type="button">测试连接</button>
        <button id="btn-save" class="primary-btn" type="button">保存</button>
      </div>
      <div id="test-result" class="test-result"></div>
      <div class="credit settings-credit">Titanium v0.1.0 · Design by Xujl</div>
    </div>
  </aside>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
