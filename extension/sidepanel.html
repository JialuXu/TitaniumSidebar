<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Titanium</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<!-- Titanium · Design by Xujl（署名只留在源码里，界面上不再展示） -->
<!--
  静态文案一律通过 data-i18n* 标注，由 sidepanel.js 的 applyStaticI18n 按当前语言写入：
    data-i18n             → textContent（元素内必须只有文字，图标/输入框旁的文字要单独包 span）
    data-i18n-title       → title
    data-i18n-placeholder → placeholder
    data-i18n-aria        → aria-label
  HTML 里保留中文原文，只是为了「未执行 JS 时也能看懂」，运行时一定会被覆写。
-->
<body>
  <!-- 头部操作行：新对话胶囊 + 设置圆钮，右对齐（产品名由浏览器侧边栏自带标题栏展示，不再重复） -->
  <div class="panel-header">
    <button id="btn-new-chat" class="pill-btn" type="button">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M8 3.2v9.6M3.2 8h9.6"/>
      </svg>
      <span data-i18n="ui.newChat">新对话</span>
    </button>
    <button id="btn-settings" class="round-btn" type="button" data-i18n-title="ui.settings" title="设置">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="8" cy="8" r="2.2"/>
        <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/>
      </svg>
    </button>
  </div>

  <!-- 上下文状态卡：读取状态 / 页面标题与字数 / 脱敏徽标 / 重新读取；空闲态整卡隐藏 -->
  <div id="context-wrap" class="context-wrap" hidden>
    <div class="context-card">
      <svg class="ctx-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/>
        <path d="M15 2v5h5"/>
        <path d="M16 13H8M16 17H8"/>
      </svg>
      <span id="ctx-caret" class="ctx-caret" hidden>▸</span>
      <span id="ctx-text" class="ctx-text">发送消息时将读取当前页面</span>
      <span id="ctx-badge" class="ctx-badge" hidden></span>
      <button id="btn-refresh" class="ctx-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
        </svg>
        <span data-i18n="ui.ctxReRead">重新读取</span>
      </button>
    </div>

    <!-- 已读取内容详情：点击状态卡展开，再次点击折叠 -->
    <div id="ctx-detail" class="ctx-detail">
      <div class="ctx-detail-meta"><span id="ctx-detail-url"></span></div>
      <div id="ctx-detail-outline" class="ctx-detail-outline" hidden></div>
      <div id="ctx-detail-text" class="ctx-detail-text"></div>
    </div>
  </div>

  <!-- 消息流 -->
  <main id="chat" class="chat">
    <div id="welcome" class="welcome">
      <div class="welcome-title">Titanium</div>
      <p data-i18n="ui.welcome">发送消息时，我会读取当前网页的文字内容作为上下文，帮你解读、总结、答疑。打开侧边栏本身不读取页面。</p>
    </div>
  </main>

  <!-- 未配置模型接口时的引导条 -->
  <div id="config-hint" class="config-hint" hidden>
    <span data-i18n="ui.configHint">尚未配置模型接口</span>
    <button id="btn-goto-settings" class="link-btn" type="button" data-i18n="ui.gotoSettings">去设置</button>
  </div>

  <!-- 输入区：白色圆角卡片内含「+」菜单、输入框与发送胶囊 -->
  <footer class="composer">
    <div class="composer-card">
      <!-- 「+」功能菜单：菜单项由 sidepanel.js 的 COMPOSER_MENU_ITEMS 登记表渲染 -->
      <div class="composer-tools">
        <button id="btn-plus" class="plus-btn" type="button" data-i18n-title="ui.more" title="更多功能" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M8 3.2v9.6M3.2 8h9.6"/>
          </svg>
        </button>
        <div id="plus-menu" class="plus-menu" role="menu" data-i18n-aria="ui.more" aria-label="更多功能"></div>
      </div>
      <textarea id="input" rows="1" data-i18n-placeholder="ui.inputPlaceholder" placeholder="Enter 发送，Shift+Enter 换行"></textarea>
      <button id="btn-send" class="send-btn" type="button" data-i18n="ui.send">发送</button>
    </div>
  </footer>

  <!-- 设置抽屉 -->
  <div id="settings-mask" class="settings-mask"></div>
  <aside id="settings" class="settings" data-i18n-aria="ui.settings" aria-label="设置">
    <div class="settings-head">
      <span data-i18n="ui.settings">设置</span>
      <button id="btn-close-settings" class="icon-btn" type="button" data-i18n-title="ui.close" title="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label class="cfg-field">
        <span data-i18n="ui.cfgLanguage">语言 / Language</span>
        <!-- 选项由 sidepanel.js 用 LOCALE_LABELS 渲染（各语言用自己的写法，不随界面语言变化） -->
        <select id="cfg-locale"></select>
      </label>
      <label class="cfg-field">
        <span data-i18n="ui.cfgBaseUrl">接口地址（baseUrl）</span>
        <input id="cfg-baseurl" type="text" placeholder="https://api.deepseek.com/v1" spellcheck="false">
      </label>
      <label class="cfg-field">
        <span data-i18n="ui.cfgModel">模型名称</span>
        <input id="cfg-model" type="text" placeholder="deepseek-chat" spellcheck="false">
      </label>
      <label class="cfg-field">
        <span data-i18n="ui.cfgApiKey">API Key</span>
        <input id="cfg-apikey" type="password" data-i18n-placeholder="ui.cfgApiKeyPlaceholder" placeholder="可留空">
      </label>
      <label class="cfg-switch">
        <input id="cfg-mask" type="checkbox" checked>
        <span data-i18n="ui.cfgMask">发送前脱敏</span>
      </label>
      <p class="cfg-hint" data-i18n="ui.cfgMaskHint">身份证 / 银行卡 / 手机号</p>
      <label class="cfg-switch">
        <input id="cfg-vision" type="checkbox">
        <span data-i18n="ui.cfgVision">模型支持视觉</span>
      </label>
      <p class="cfg-hint" data-i18n="ui.cfgVisionHint">启用截图工具；截图无法脱敏。</p>
      <label class="cfg-switch">
        <input id="cfg-actions" type="checkbox">
        <span data-i18n="ui.cfgActions">允许页面操作</span>
      </label>
      <p class="cfg-hint cfg-hint-warn" data-i18n="ui.cfgActionsHint">AI 可点击、输入、跳转当前页面。每步可见、可随时停止，不可逆操作会先确认。</p>
      <div class="settings-actions">
        <button id="btn-test" class="ghost-btn" type="button" data-i18n="ui.cfgTest">测试连接</button>
        <button id="btn-save" class="primary-btn" type="button" data-i18n="ui.cfgSave">保存</button>
      </div>
      <div id="test-result" class="test-result"></div>
      <div class="credit">Titanium v0.3.1</div>
    </div>
  </aside>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
